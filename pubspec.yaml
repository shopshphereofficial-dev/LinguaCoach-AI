name: lingua_coach_ai
description: "LinguaCoach AI - a Duolingo-style multi-language learning app powered by the Google Gemini API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  # Pinned to 6.6.0: 6.6.1+ depends on `js ^0.7.1`, which conflicts with the
  # `js ^0.6.3` that flutter_secure_storage_web requires.
  speech_to_text: 6.6.0
  # Pinned to 4.2.3: 4.2.5 ships a Kotlin 2.2 stdlib, which the Kotlin compiler
  # in Flutter 3.24.5's Android template cannot read.
  flutter_tts: 4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
