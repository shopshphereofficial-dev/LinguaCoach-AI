name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # The android/ platform folder is generated fresh on the runner, so the
      # repository stays free of binaries like gradle-wrapper.jar.
      - name: Scaffold Android platform files
        run: |
          flutter create --platforms=android --org com.linguacoach \
            --project-name lingua_coach_ai /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Patch AndroidManifest and Gradle (permissions, minSdk, label)
        run: python3 .github/scripts/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational, does not fail the build)
        run: flutter analyze || true

      # The Gemini API key is injected here from the repository secret, so it is
      # baked into the APK but never stored in the source code. Secrets are
      # masked in the logs.
      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=GEMINI_MODEL=gemini-flash-latest

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingua-coach-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to the v1.0.1 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: LinguaCoach AI v1.0.1
          body: |
            Automatic build of the LinguaCoach AI release APK.

            Download `app-release.apk` below and install it on your Android
            device (you may need to allow "Install unknown apps").

            This build ships with the API key already configured, so there is
            no setup screen.
          files: build/app/outputs/flutter-apk/app-release.apk
